<!doctype html>
<!-- Frozen. The page; public/app.js wires it up. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event sign-up</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1b2622; background: #f7f7f4; }
      form, section { background: #fff; border: 1px solid #dcdfd8; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
      input, button { font: inherit; padding: 6px 10px; margin: 4px 4px 4px 0; }
      li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
      #message { min-height: 1.5em; color: #b4321f; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <h1>Event sign-up</h1>
    <form id="login-form">
      <input id="email" type="email" placeholder="alice@example.com" required />
      <input id="password" type="password" placeholder="password" required />
      <button type="submit">Sign in</button>
    </form>
    <section id="session" hidden>
      Signed in as <b id="me"></b> <button id="logout" type="button">Sign out</button>
    </section>
    <section>
      <h2>Upcoming events</h2>
      <ul id="events"></ul>
    </section>
    <p id="message"></p>
    <script type="module" src="app.js"></script>
  </body>
</html>
